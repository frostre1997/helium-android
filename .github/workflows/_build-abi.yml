name: Build Helium - Android

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'Run specific ABI or ALL'
        required: true
        type: choice
        options:
          - all
          - arm64
          - arm
          - x64
          - x86

permissions:
  contents: read

jobs:
  # This job generates the list of ABIs to build
  setup:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      abi_list: ${{ steps.set-matrix.outputs.abi_list }}
    steps:
      - name: Generate Matrix
        id: set-matrix
        run: |
          if [ "${{ inputs.abi }}" == "all" ]; then
            echo 'abi_list=["arm64", "arm", "x64", "x86"]' >> $GITHUB_OUTPUT
          else
            echo 'abi_list=["${{ inputs.abi }}"]' >> $GITHUB_OUTPUT
          fi

  # This matrix builds the architectures in parallel
  build:
    name: Build ${{ matrix.abi }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # We pull the list dynamically from the setup job
        abi: ${{ fromJson(needs.setup.outputs.abi_list) }}
    concurrency:
      group: ${{ matrix.abi }}
      cancel-in-progress: false

    steps:
      - name: Checkout Android fork
        uses: actions/checkout@v6
        with:
          path: helium-android
          fetch-depth: 1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          tool-cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip curl python3 python3-pip

      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: depot_tools
          key: depot-tools-${{ runner.os }}-v2

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          fi
          echo "$PWD/depot_tools" >> $GITHUB_PATH
          export PATH="$PWD/depot_tools:$PATH"
          gclient version

      - name: Fetch Chromium Source
        run: |
          git config --global http.postBuffer 524288000
          git config --global advice.detachedHead false
          export GIT_TERMINAL_PROMPT=0
          mkdir -p chromium && cd chromium
          (while true; do echo "[TASK] Size: $(du -sh src 2>/dev/null | cut -f1)"; sleep 30; done) &
          MONITOR_PID=$!
          fetch --git-cache --nohooks --no-history android
          kill $MONITOR_PID
          cd src
          ./build/install-build-deps.sh --android
          gclient runhooks

      - name: Prepare Android SDK directory
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk
          sudo chown -R $USER:$USER /usr/local/lib/android

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK & Platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install Python deps for patching
        run: pip install 'httpx[http2]' zstandard

      - name: Apply Helium UI Patches
        run: |
          cd chromium/src
          PATCH_DIR="../../helium-android/patches"
          SERIES_FILE="$PATCH_DIR/series"
          if [ ! -f "$SERIES_FILE" ]; then exit 1; fi
          while IFS= read -r patch_name || [ -n "$patch_name" ]; do
           [[ -z "$patch_name" || "$patch_name" =~ ^# ]] && continue
           patch -p1 --forward --ignore-whitespace -i "$PATCH_DIR/$patch_name" < /dev/null || status=$?
           if [ "${status:-0}" -ge 2 ]; then exit 1; fi
           unset status
          done < "$SERIES_FILE"

      - name: Configure GN
        run: |
          cd chromium/src
          mkdir -p out/${{ matrix.abi }}
          cat > out/${{ matrix.abi }}/args.gn <<EOF
          target_os = "android"
          target_cpu = "${{ matrix.abi }}"
          is_debug = false
          is_official_build = true
          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          is_component_build = false
          enable_nacl = false
          use_thin_lto = false
          safe_browsing_mode = 0
          android_sdk_root = "$ANDROID_HOME"
          android_ndk_root = "$ANDROID_HOME/ndk/27.2.12479018"
          android_ndk_version = "27.2.12479018"
          EOF
          gn gen out/${{ matrix.abi }}

      - name: Build APK
        run: |
          cd chromium/src
          autoninja -C out/${{ matrix.abi }} chrome_public_apk -j 4
          
          # Rename exactly how you want them
          if [ "${{ matrix.abi }}" == "arm64" ]; then mv out/arm64/apks/ChromePublic.apk out/ChromePublic64.apk; fi
          if [ "${{ matrix.abi }}" == "arm" ]; then mv out/arm/apks/ChromePublic.apk out/ChromePublic32.apk; fi
          if [ "${{ matrix.abi }}" == "x64" ]; then mv out/x64/apks/ChromePublic.apk out/ChromePublic-x64.apk; fi
          if [ "${{ matrix.abi }}" == "x86" ]; then mv out/x86/apks/ChromePublic.apk out/ChromePublic-x86.apk; fi

      - name: Upload Raw APK
        uses: actions/upload-artifact@v7
        with:
          name: raw-apk-${{ matrix.abi }}
          path: chromium/src/out/ChromePublic*.apk
          if-no-files-found: error

  # This job merges the APKs into the Universal one and publishes your 3 files
  package:
    name: Package Universal APK
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Download all APKs
        uses: actions/download-artifact@v7
        with:
          pattern: raw-apk-*
          path: apks/
          merge-multiple: true

      - name: Setup Java & Android Tools
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK (for zipalign/apksigner)
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'

      - name: Prepare Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Merge into Universal
        run: |
          python3 app_bundle_package.py \
            --base apks/ChromePublic64.apk \
            --arm apks/ChromePublic32.apk \
            --x64 apks/ChromePublic-x64.apk \
            --x86 apks/ChromePublic-x86.apk \
            --out apks/ChromePublic-Universal.apk \
            --keystore debug.keystore \
            --ks-pass android \
            --ks-alias androiddebugkey

      - name: Upload Final 3 APKs
        uses: actions/upload-artifact@v4
        with:
          name: Helium-APKs
          path: |
            apks/ChromePublic64.apk
            apks/ChromePublic32.apk
            apks/ChromePublic-Universal.apk
          if-no-files-found: error
