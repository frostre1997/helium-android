name: Build Helium - Android

on:
  workflow_call:
    inputs:
      abi:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      abi:
        description: 'Target ABI'
        required: true
        type: choice
        options:
          - arm64
          - arm
          - x64
          - x86

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: ${{ inputs.abi }}
      cancel-in-progress: false

    steps:
      # ---------- 1. Sources ----------
      - name: Checkout Android fork
        uses: actions/checkout@v6
        with:
          path: helium-android
          fetch-depth: 1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          tool-cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip curl python3 python3-pip

      # ---------- 2. Fetch Chromium (Official Way) ----------
      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: depot_tools
          key: depot-tools-${{ runner.os }}-v2

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          fi
          echo "$PWD/depot_tools" >> $GITHUB_PATH
          export PATH="$PWD/depot_tools:$PATH"
          gclient version

      - name: Fetch Chromium Source
        run: |
          # Prevent Git from hanging on authentication prompts
          git config --global http.postBuffer 524288000
          git config --global advice.detachedHead false
          export GIT_TERMINAL_PROMPT=0

          mkdir -p chromium && cd chromium
          
          # Start a background monitor to print the folder size every 30 seconds
          (
            while true; do
              SIZE=$(du -sh src 2>/dev/null | cut -f1)
              echo "[TASK] Current size: ${SIZE:-Initializing...}"
              sleep 30
            done
          ) &
          MONITOR_PID=$!

          # Fetch WITHOUT the -v flag
          echo "Starting Chromium fetch (this will take 20-30 minutes)..."
          fetch --git-cache --nohooks --no-history android
          
          # Stop the monitor
          kill $MONITOR_PID
          
          echo "Fetch complete! Running build dependencies and hooks..."
          cd src
          ./build/install-build-deps.sh --android
          
          echo "Running gclient runhooks (generating GN configs)..."
          gclient runhooks

      # ---------- 3. Android Toolchain ----------
      - name: Prepare Android SDK directory
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk
          sudo chown -R $USER:$USER /usr/local/lib/android

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK & Platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      # ---------- 4. Apply Helium Patches ----------
      - name: Install Python deps for patching
        run: pip install 'httpx[http2]' zstandard

      - name: Apply Helium UI Patches
        run: |
          cd chromium/src
          PATCH_DIR="../../helium-android/patches"
          SERIES_FILE="$PATCH_DIR/series"
    
          if [ ! -f "$SERIES_FILE" ]; then
            echo "::error::Missing series file at $SERIES_FILE"
            exit 1
          fi

          echo "Starting patch application..."
    
          while IFS= read -r patch_name || [ -n "$patch_name" ]; do
            # Skip empty lines and comments in the series file
           [[ -z "$patch_name" || "$patch_name" =~ ^# ]] && continue
      
           echo "Applying: $patch_name"
      
           # Apply the patch. We add '|| true' to ignore exit code 1 (already applied),
           # but we will check for exit code 2 (real failure) afterwards.
           patch -p1 --forward --ignore-whitespace -i "$PATCH_DIR/$patch_name" < /dev/null || status=$?
      
           # If patch returned 2 or higher, it's a real conflict, not a reversed patch
           if [ "${status:-0}" -ge 2 ]; then
             echo "::error::Failed to apply $patch_name"
             exit 1
           fi
      
           # Reset status for the next loop
           unset status
             done < "$SERIES_FILE"
    
           echo "All patches applied successfully (or were already present)!"
    
      # ---------- 5. GN & Build ----------
      - name: Configure GN
        run: |
          cd chromium/src
          mkdir -p out/${{ inputs.abi }}
          
          cat > out/${{ inputs.abi }}/args.gn <<EOF
          target_os = "android"
          target_cpu = "${{ inputs.abi }}"
          is_debug = false
          is_official_build = true
          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          is_component_build = false
          enable_nacl = false
          use_thin_lto = false
          android_sdk_root = "$ANDROID_HOME"
          android_ndk_root = "$ANDROID_HOME/ndk/27.2.12479018"
          android_ndk_version = "27.2.12479018"
          EOF
          
          echo "Generating Ninja build files..."
          gn gen out/${{ inputs.abi }}

      - name: Build APK
        run: |
          cd chromium/src
          echo "Starting compilation (this will take 1-3 hours)..."
          autoninja -C out/${{ inputs.abi }} chrome_public_apk -j 4

      # ---------- 6. Artifact ----------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: helium-android-ui-${{ inputs.abi }}-${{ github.run_number }}
          path: chromium/src/out/${{ inputs.abi }}/apks/ChromePublic.apk
          if-no-files-found: error
          retention-days: 14
