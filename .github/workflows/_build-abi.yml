name: Helium Build CI (Android)

on:
  workflow_call:
    inputs:
      abi:
        required: true
        type: string
      helium_ref:
        required: false
        type: string
        default: main
  workflow_dispatch:
    inputs:
      abi:
        description: 'Target ABI'
        required: true
        type: choice
        options:
          - arm64
          - arm
          - x64
          - x86
      helium_ref:
        description: 'Upstream Helium ref (branch or tag)'
        required: false
        type: string
        default: 'main'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: build-${{ inputs.abi }}
      cancel-in-progress: false

    steps:
      # ---------- 1. Sources ----------
      - name: Checkout Android fork
        uses: actions/checkout@v6
        with:
          path: helium-android
          fetch-depth: 1

      - name: Checkout upstream Helium
        uses: actions/checkout@v6
        with:
          repository: imputnet/helium
          ref: ${{ inputs.helium_ref }}
          path: upstream-helium
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip curl

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python deps
        run: pip install 'httpx[http2]' zstandard

      # ---------- 2. Chromium Fetch & Unpack ----------
      - name: Restore Chromium download cache
        uses: actions/cache@v4
        with:
          path: chromium_download_cache
          key: ${{ runner.os }}-chromium-dl-${{ hashFiles('upstream-helium/chromium_version.txt', 'upstream-helium/downloads.ini', 'upstream-helium/deps.ini') }}
          restore-keys: |
            ${{ runner.os }}-chromium-dl-

      - name: Retrieve Chromium tarballs
        run: |
          mkdir -p chromium_download_cache
          ./upstream-helium/utils/downloads.py retrieve -i upstream-helium/downloads.ini -c chromium_download_cache &
          DEPS_PID=$!
          ./upstream-helium/utils/downloads.py retrieve -i upstream-helium/deps.ini -c chromium_download_cache
          wait "$DEPS_PID"

      - name: Unpack Chromium source
        run: |
          rm -rf chromium_src
          ./upstream-helium/utils/downloads.py unpack -i upstream-helium/downloads.ini -c chromium_download_cache chromium_src
          ./upstream-helium/utils/downloads.py unpack -i upstream-helium/deps.ini -c chromium_download_cache chromium_src

      # ---------- 3. Android Toolchain ----------
      - name: Prepare Android SDK directory
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk
          sudo chown -R $USER:$USER /usr/local/lib/android

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        id: android-sdk-cache
        with:
          path: /usr/local/lib/android
          key: ${{ runner.os }}-android-sdk-ndk27-v2

      - name: Setup Android SDK & NDK
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Export Android Home
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      # ---------- 4. Patches & Configs ----------
      - name: Prune binaries
        run: |
          ./upstream-helium/utils/prune_binaries.py chromium_src helium-android/pruning.list

      - name: Apply Patches
        run: |
          ./upstream-helium/utils/patches.py apply chromium_src helium-android/patches

      - name: Domain substitution
        run: |
          ./upstream-helium/utils/domain_substitution.py apply \
            -r upstream-helium/domain_regex.list \
            -f helium-android/domain_substitution.list \
            chromium_src

      - name: Copy Config Files from Repo
        run: |
          mkdir -p chromium_src/build/config
          cp helium-android/ci/gclient_args.gni chromium_src/build/config/gclient_args.gni

      # ---------- 5. GN & Build ----------
      - name: Install gn
        run: |
          mkdir -p $HOME/gn && cd $HOME/gn
          curl -sSLo gn.zip "https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest"
          unzip -o gn.zip && chmod +x gn
          echo "$HOME/gn" >> $GITHUB_PATH

      - name: Configure GN
        run: |
          cd chromium_src
          mkdir -p out/${{ inputs.abi }}
          # Replace %ABI% in our template with the matrix value
          sed "s/%ABI%/${{ inputs.abi }}/g" ../helium-android/ci/args.gn > out/${{ inputs.abi }}/args.gn
          gn gen out/${{ inputs.abi }}

      - name: Restore Build Output Cache
        uses: actions/cache@v4
        with:
          path: chromium_src/out/${{ inputs.abi }}
          key: ${{ runner.os }}-out-${{ inputs.abi }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-out-${{ inputs.abi }}-

      - name: Build APK
        run: |
          cd chromium_src
          ninja -C out/${{ inputs.abi }} chrome_public_apk -j 4

      # ---------- 6. Artifact ----------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: helium-android-${{ inputs.abi }}-${{ github.run_number }}
          path: chromium_src/out/${{ inputs.abi }}/apks/ChromePublic.apk
          if-no-files-found: error
          retention-days: 14
