name: Build Helium Android (Official Source)

on:
  workflow_call:
    inputs:
      abi:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      abi:
        description: 'Target ABI'
        required: true
        type: choice
        options:
          - arm64
          - arm
          - x64
          - x86

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: build-${{ inputs.abi }}
      cancel-in-progress: false

    steps:
      # ---------- 1. Sources ----------
      - name: Checkout Android fork
        uses: actions/checkout@v6
        with:
          path: helium-android
          fetch-depth: 1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          tool-cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip curl python3 python3-pip

      # ---------- 2. Fetch Chromium ----------
      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: depot_tools
          key: depot-tools-${{ runner.os }}-v2

      - name: Install depot_tools
        run: |
          if [ ! -d depot_tools ]; then
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          fi
          echo "$PWD/depot_tools" >> $GITHUB_PATH
          export PATH="$PWD/depot_tools:$PATH"
          gclient version

      - name: Fetch Chromium Source
        run: |
          # Fetch without history to save time and disk space
          mkdir -p chromium && cd chromium
          fetch --nohooks --no-history android
          
          # This is the magic step we missed before! It generates gclient_args.gni
          cd src
          ./build/install-build-deps.sh --android
          gclient runhooks

      # ---------- 3. Android Toolchain ----------
      - name: Prepare Android SDK directory
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk
          sudo chown -R $USER:$USER /usr/local/lib/android

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK & Platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      # ---------- 4. Apply Helium Patches ----------
      - name: Install Python deps for patching
        run: pip install 'httpx[http2]' zstandard

      - name: Prune binaries
        run: |
          cd chromium
          python3 ../helium-android/utils/prune_binaries.py src ../helium-android/pruning.list

      - name: Apply Helium UI Patches
        run: |
          cd chromium
          # Using the patch script from your repo
          python3 ../helium-android/utils/patches.py apply src ../helium-android/patches

      # ---------- 5. GN & Build ----------
      - name: Configure GN
        run: |
          cd chromium/src
          mkdir -p out/${{ inputs.abi }}
          
          # Simple, clean args because gclient already generated the rest
          cat > out/${{ inputs.abi }}/args.gn <<EOF
          target_os = "android"
          target_cpu = "${{ inputs.abi }}"
          is_debug = false
          is_official_build = true
          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          is_component_build = false
          enable_nacl = false
          use_thin_lto = false
          android_sdk_root = "$ANDROID_HOME"
          android_ndk_root = "$ANDROID_HOME/ndk/27.2.12479018"
          android_ndk_version = "27.2.12479018"
          EOF
          
          gn gen out/${{ inputs.abi }}

      - name: Build APK
        run: |
          cd chromium/src
          autoninja -C out/${{ inputs.abi }} chrome_public_apk -j 4

      # ---------- 6. Artifact ----------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: helium-android-ui-${{ inputs.abi }}-${{ github.run_number }}
          path: chromium/src/out/${{ inputs.abi }}/apks/ChromePublic.apk
          if-no-files-found: error
          retention-days: 14
